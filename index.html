
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RTM GIFT Entertainment</title>
<link rel="icon" type="image/png" href="d0cc9608-f3a8-438e-83e6-d7ee3111d599-removebg-preview.png">

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #ffdeab, #ffe3b9);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.box {
  background: white;
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);

  transition: 0.7s;
}

.box.hide {
  opacity: 0;
  transform: scale(0.85);
}
#status{
    margin-top:15px;
    font-size:18px;
    color:#ff7b00;
    font-weight:bold;
}
input {
  padding: 12px;
  width: 220px;
  font-size: 16px;
  text-align: center;
}
button {
  margin-top: 15px;
  padding: 12px 25px;
  font-size: 16px;
  cursor: pointer;
}
#error {
  color: red;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="box">
  <h2>RTM Entertainment</h2>

  <input type="text" id="codeInput" placeholder="Введите код">
  <br>
  <button onclick="checkCode()">Подтвердить</button>
  <p id="error"></p>
  <p id="status"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
function checkCode() {
  var code = document.getElementById("codeInput").value;

  var links = {
    "rT7iuX": "https://google.com",
    "pG2clH": "https://youtube.com",
    "zW8xwC": "https://github.com",
    "qW1wcU": "https://github.com"
  };

  if (links[code]) {

    fetch("https://api.telegram.org/bot8779672611:AAHfL9289ohb8GvDvKh1zxceX62I30Fmf-I/sendMessage", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        chat_id: "531516216",
        text: "🎁 Она ввела код: " + code
      })
    });

    const status = document.getElementById("status");
    const button = document.querySelector("button");
    button.disabled = true;

    status.innerHTML = "🔍 Проверяем код...";
    setTimeout(() => {

    status.innerHTML = "✅ Код принят!";

    },2000);
    setTimeout(() => {

    confetti({
        particleCount:360,
        spread:240,
        origin:{y:0.6}
    });

    status.innerHTML = "🎁 Подарок найден!";

    },3000);
    setTimeout(() => {

    document.querySelector(".box").classList.add("hide");

    },4200);
    setTimeout(() => {

    window.location.href = links[code];

    },5200);


  } else {
    document.getElementById("error").innerText = "❌ Неверный код";
  }
}
</script>

</body>
</html>
