<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Первый подарок</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ffdeab,#ffe3b9);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    width:380px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    text-align:center;
}

button{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

button:hover{
    transform:scale(1.03);
}

#quiz{
    display:none;
}

#gift{
    display:none;
}

</style>
</head>

<body>

<div class="box">

<div id="intro">

<h2>🎁 Первый подарок</h2>

<p>
Перед тем как получить свой первый подарок,
тебе предстоит пройти небольшой тест.
<br><br>
Не переживай ❤️
Все вопросы очень простые.
</p>

<button onclick="startTest()">
Начать тест
</button>

</div>

<div id="quiz">

<h2 id="title"></h2>

<p id="question"></p>

<div id="answers"></div>

</div>

<div id="gift"></div>

</div>

<script>

const questions=[

{
question:"Что тебе больше нравится создавать?",
answers:[
"🎬 Видео",
"📸 Фото",
"🎵 Музыка",
"✨ Всё сразу"
],
correct:3
},

{
question:"Что самое важное в хорошем видео?",
answers:[
"🎤 Хороший звук",
"💡 Свет",
"🎬 Монтаж",
"❤️ Всё вместе"
],
correct:3
},

{
question:"Готова открыть подарок?",
answers:[
"Конечно ❤️",
"Да!",
"Очень!",
"Все варианты 😄"
],
correct:3
}

];

let currentQuestion=0;
let score=0;

function startTest(){

document.getElementById("intro").style.display="none";
document.getElementById("quiz").style.display="block";

showQuestion();

}

function showQuestion(){

document.getElementById("title").innerHTML=
"Вопрос "+(currentQuestion+1)+" из "+questions.length;

document.getElementById("question").innerHTML=
questions[currentQuestion].question;

const answers=document.getElementById("answers");

answers.innerHTML="";

questions[currentQuestion].answers.forEach((answer,index)=>{

answers.innerHTML+=`
<button onclick="checkAnswer(${index})">
${answer}
</button>
`;

});

}

function checkAnswer(index){

if(index===questions[currentQuestion].correct){

score++;

}

currentQuestion++;

if(currentQuestion<questions.length){

showQuestion();

}else{

finishTest();

}

}

function finishTest(){

document.getElementById("quiz").style.display="none";

document.getElementById("gift").style.display="block";

let message="";

if(score==3){

message="🏆 Идеально!";

}else if(score==2){

message="😄 Отличный результат!";

}else{

message="❤️ Самое главное — ты дошла до конца!";
}

document.getElementById("gift").innerHTML=`

<h2>🎙️ Первый подарок</h2>

<p>

${message}

<br><br>

Правильных ответов:

<b>${score} из ${questions.length}</b>

<br><br>

Ты заслужила свой первый подарок ❤️

</p>

`;

}

</script>

</body>
</html>
