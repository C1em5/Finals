<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>RTMcop</title>
<link rel="icon" type="image/png" href="d0cc9608-f3a8-438e-83e6-d7ee3111d599-removebg-preview.png">

<style>

body {
    font-family: Arial;
    background: linear-gradient(135deg, #ffdeab, #ffe3b9);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
}

.box {
    background:white;
    padding:30px;
    border-radius:25px;
    text-align:center;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

button {
    display:block;
    width:100%;
    margin:10px 0;
    padding:12px;
    border-radius:15px;
    border:none;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover {
    transform:scale(1.05);
}

#gift{
    display:none;
    font-size:35px;
}

</style>

</head>

<body>

<div class="box">

    <!-- Стартовая страница -->

    <div id="intro">

        <h2>🎁 Первый подарок</h2>

        <p>
            Перед тем как открыть свой первый подарок,
            тебе предстоит пройти небольшой тест.
            <br><br>
            Не переживай ❤️
            Все вопросы очень простые.
        </p>

        <button onclick="startTest()">
            Начать тест
        </button>

    </div>

    <!-- Тест -->

    <div id="quiz" style="display:none;">

        <h2 id="title">Вопрос 1 из 3</h2>

        <p id="question">
            Что тебе больше нравится создавать?
        </p>

        <button onclick="answer()">🎬 Видео</button>
        <button onclick="answer()">📸 Фото</button>
        <button onclick="answer()">🎵 Музыка</button>
        <button onclick="answer()">✨ Всё сразу</button>

        <div id="gift">
            🎙️
            <br><br>
            Твой подарок готов ❤️
        </div>

    </div>

</div>

<script>

let step = 0;

function startTest(){

    document.getElementById("intro").style.display = "none";
    document.getElementById("quiz").style.display = "block";

}

function answer(){

    step++;

    if(step == 1){

        document.getElementById("title").innerHTML = "Вопрос 2 из 3";

        document.getElementById("question").innerHTML =
        "Что самое важное в хорошем видео?";

    }

    else if(step == 2){

        document.getElementById("title").innerHTML = "Вопрос 3 из 3";

        document.getElementById("question").innerHTML =
        "Готова открыть подарок?";

    }

    else{

        document.getElementById("title").style.display = "none";
        document.getElementById("question").style.display = "none";

        document.querySelectorAll("#quiz button").forEach(button=>{
            button.style.display="none";
        });

        document.getElementById("gift").style.display="block";

    }

}

</script>

</body>
</html>
